{% extends 'base.html' %}
{% block title %}Profile - Smart Farmer{% endblock %}
{% block content %}
<h3><i class="bi bi-person-gear text-success"></i> My Profile</h3>
<div class="card stat-card mt-3" style="max-width:640px"><div class="card-body text-start">
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label">Email (cannot be changed)</label>
      <input class="form-control" value="{{ user.email }}" disabled></div>
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="full_name" class="form-control" value="{{ user.full_name }}" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Phone</label>
        <input name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Village / District</label>
        <input name="location" class="form-control" value="{{ user.location or '' }}"></div>
    </div>
    <hr><p class="text-muted small">Leave blank to keep your current password.</p>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Current password</label>
        <input type="password" name="current_password" class="form-control"></div>
      <div class="col-md-6 mb-3"><label class="form-label">New password (min 8)</label>
        <input type="password" name="new_password" class="form-control"></div>
    </div>
    <button class="btn btn-success">Save changes</button>
  </form>
</div></div>
{% endblock %}
