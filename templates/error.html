{% extends 'base.html' %}
{% block title %}Error {{ code }} - Smart Farmer{% endblock %}
{% block auth %}
<div class="auth-card card shadow text-center"><div class="card-body p-4 p-md-5"><div class="display-1">🌾</div>
  <h1 class="display-4 text-success">{{ code }}</h1><p class="text-muted">{{ message }}</p><a href="{{ url_for('home') }}" class="btn btn-success">{{ t('common.home') }}</a></div></div>
{% endblock %}
{% block content %}
<div class="text-center mt-5"><div class="display-1">🌾</div><h1 class="display-4 text-success">{{ code }}</h1><p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('home') }}" class="btn btn-success">{{ t('common.home') }}</a></div>
{% endblock %}
