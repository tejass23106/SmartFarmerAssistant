{% extends 'base.html' %}
{% block title %}Change Password - Smart Farmer{% endblock %}
{% block content %}
<h3><i class="bi bi-shield-lock text-success"></i> Change Password</h3>
<p class="text-muted">Use at least 8 characters with a mix of letters and numbers.</p>
<div class="card stat-card mt-3" style="max-width:520px"><div class="card-body text-start">
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="mb-3">
      <label class="form-label" for="cp0">Current password</label>
      <div class="input-group">
        <input type="password" id="cp0" name="current_password" class="form-control" autocomplete="current-password" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="#cp0" aria-label="Show or hide"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="cp1">New password</label>
      <div class="input-group">
        <input type="password" id="cp1" name="new_password" class="form-control" autocomplete="new-password" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="#cp1" aria-label="Show or hide"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="cp2">Confirm new password</label>
      <div class="input-group">
        <input type="password" id="cp2" name="confirm_password" class="form-control" autocomplete="new-password" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="#cp2" aria-label="Show or hide"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <button class="btn btn-success">Update password</button>
  </form>
</div></div>
{% endblock %}
